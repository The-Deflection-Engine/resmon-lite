[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "resmon-lite"
version = "0.1.0"
description = "Lightweight CPU/RAM/GPU stats tray app for Ubuntu (AMD GPUs)"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
dependencies = ["PyGObject>=3.42"]

[project.scripts]
resmon-lite = "resmon_lite.__main__:main"

[tool.setuptools.packages.find]
include = ["resmon_lite*"]
